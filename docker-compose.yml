version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: nevora-db
    environment:
      POSTGRES_USER: nevora
      POSTGRES_PASSWORD: nevora
      POSTGRES_DB: nevora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nevora"]
      interval: 2s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:16-alpine
    container_name: nevora-db-test
    environment:
      POSTGRES_USER: nevora_test
      POSTGRES_PASSWORD: nevora_test
      POSTGRES_DB: nevora_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nevora_test"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
